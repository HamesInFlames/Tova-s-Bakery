<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#ffffff" />

    <title>Tova's Bakery — Kosher, Nut-Free, COR-Certified Bakery in Markham</title>
    <meta
      name="description"
      content="Tova's Bakery — kosher, nut-free, COR-certified wholesale & retail bakery in Markham, Ontario. Traditional challah and Eastern European baked goods since 1999."

    <link rel="canonical" href="https://tovasbakery.com/" />
    <link rel="icon" type="image/png" href="/images/brand/logo.png" />
    <link rel="apple-touch-icon" href="/images/brand/logo.png" />

    <!-- Geo -->
    <meta name="geo.region" content="CA-ON" />
    <meta name="geo.placename" content="Markham, Ontario" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tova's Bakery" />
    <meta property="og:title" content="Tova's Bakery — Kosher, Nut-Free, COR-Certified Bakery" />

      property="og:description"
      content="Traditional challah and Eastern European baked goods. Kosher, nut-free, COR-certified. Wholesale & retail since 1999."

    <meta property="og:url" content="https://tovasbakery.com/" />
    <meta property="og:image" content="https://tovasbakery.com/images/brand/logo.png" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tova's Bakery — Kosher, Nut-Free, COR-Certified Bakery" />
    <meta
      name="twitter:description"
      content="Traditional challah and Eastern European baked goods. Kosher, nut-free, COR-certified. Wholesale & retail since 1999."
    />
    <meta name="twitter:image" content="https://tovasbakery.com/images/brand/logo.png" />

    <!-- Preload the above-the-fold hero logo (LCP element) -->

    <!-- Fonts are self-hosted (@fontsource/jost, interim Cera Pro stand-in) —

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Bakery",
        "name": "Tova's Bakery",
        "image": "https://tovasbakery.com/images/brand/logo.png",
        "url": "https://tovasbakery.com/",
        "telephone": "+1-905-881-2861",
        "foundingDate": "1999",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "350 John Street",
          "addressLocality": "Markham",
          "addressRegion": "ON",
          "postalCode": "L3T 5W6",
          "addressCountry": "CA"
        },
        "priceRange": "$$",
        "servesCuisine": ["Kosher", "Jewish", "Eastern European"],
        "keywords": "kosher, nut-free, COR certified, challah, wholesale bakery, Markham",

          "https://www.facebook.com/tovas.bakery.toronto",
          "https://www.instagram.com/tovas_bakery"
